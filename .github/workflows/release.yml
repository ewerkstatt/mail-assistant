name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set version from tag
        shell: pwsh
        run: Set-Content -Path version.py -Value "VERSION = `"$($env:GITHUB_REF_NAME.TrimStart('v'))`""

      - name: Build exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name Mail-Assistant `
            --hidden-import keyring.backends.Windows --hidden-import win32com.client main.py

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Mail-Assistant.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/Mail-Assistant.exe.sha256 -Value "$hash  Mail-Assistant.exe" -NoNewline

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/Mail-Assistant.exe dist/Mail-Assistant.exe.sha256 --generate-notes
